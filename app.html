<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="app_style.css">
    <title>LostUnFound</title>

</head>
<body>

<main>
<div id="container">
    <div id="content">

        <h1>Ahoy, Treasure Hunter!</h1>

        <p>
            Enter your name before the treasure hunt begins
        </p>

        <input type="text"
               id="playerName"
               placeholder="Enter your pirate name">

        <button onclick="startAdventure()">
            Begin Adventure
        </button>

    </div>

</div>

    <script>

        function startAdventure() {

            let playerName = document.getElementById('playerName').value;

            if (playerName === "") {
                alert("Please enter your name!");
            }


            window.location.href = "List.html";

        }



    </script>

</main>

</body>
</html>
